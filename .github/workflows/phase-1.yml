name: Phase 1

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/phase-1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, type check and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: pip install .[dev]
      # The backup tests run restic itself against a local repository: the version the
      # app image has (Ubuntu 24.04's 0.16 lacks the exit codes Skjald reads), pinned to
      # the SHA-256 in restic's signed checksum list (key CF8F18F2844575973F79D4E191A6868BD3F7A907).
      - name: Install restic
        env:
          RESTIC_VERSION: "0.18.0"
          RESTIC_SHA256: 98f6dd8bf5b59058d04bfd8dab58e196cc2a680666ccee90275a3b722374438e
        run: |
          curl -fsSLo /tmp/restic.bz2 \
            "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          echo "${RESTIC_SHA256}  /tmp/restic.bz2" | sha256sum -c -
          bunzip2 -c /tmp/restic.bz2 >/tmp/restic
          sudo install -m 0755 /tmp/restic /usr/local/bin/restic
          restic version
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy app
      - name: Test
        run: pytest

  frontend:
    name: Frontend lint, type check and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  deploy:
    name: Installer and scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # ShellCheck comes with the runner image.
      - name: Lint the shell scripts
        run: shellcheck -x deploy/*.sh deploy/skjald frontend/e2e/run.sh
      - name: Test the installer's functions
        run: deploy/install.test.sh
      - name: Test the skjald command's own logic
        run: deploy/skjald.test.sh

  browser:
    name: Browser tests against the full stack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Throwaway master key (as install.sh makes it)
        run: |
          sudo install -d -o 10001 -g 10001 -m 0700 /etc/skjald
          sudo sh -c 'head -c 32 /dev/urandom > /etc/skjald/master.key'
          sudo chown 10001:10001 /etc/skjald/master.key
          sudo chmod 0600 /etc/skjald/master.key
      - name: Run Playwright against Caddy, the app and its database
        run: frontend/e2e/run.sh
      - name: Keep screenshots and traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-results
          path: frontend/e2e-results/
          if-no-files-found: ignore
