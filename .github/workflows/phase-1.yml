name: Phase 1

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/phase-1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, type check and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: pip install .[dev]
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy app
      - name: Test
        run: pytest

  frontend:
    name: Frontend lint, type check and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
