name: Phase 0 spikes

on:
  pull_request:
    paths:
      - "spikes/**"
      - ".github/workflows/spikes.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spikes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdf-signing:
    name: PDF/A rendering and signatures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: spikes/pdf-signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qpdf libpango-1.0-0 libpangoft2-1.0-0
      - name: Python packages
        run: pip install -r requirements.txt
      - name: Fonts (SIL OFL, from Fontsource)
        run: |
          mkdir -p fontsrc && cd fontsrc
          npm pack @fontsource/marcellus@5.3.0 @fontsource/ibm-plex-sans@5.3.0 @fontsource/ibm-plex-mono@5.3.0 @fontsource/mr-dafoe@5.3.0
          for f in fontsource-*.tgz; do mkdir -p "${f%.tgz}" && tar -xzf "$f" -C "${f%.tgz}"; done
          cd .. && python make_fonts.py fontsrc fonts
      - name: Run the spike
        run: python spike.py --fonts fonts --out out
      - name: Check the results
        run: python ci_check.py out/report.json
      - name: Validate PDF/A with veraPDF
        run: |
          docker run --rm -v "$PWD/out:/data" verapdf/cli --format text \
            /data/2-final-unsigned.pdf /data/3-signed-3-company.pdf | tee verapdf.txt
          test "$(grep -c "^PASS" verapdf.txt)" -eq 2
          ! grep -q "^FAIL" verapdf.txt
      - name: Keep the PDFs and the veraPDF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-sample-report
          path: |
            spikes/pdf-signing/out/*.pdf
            spikes/pdf-signing/verapdf.txt
          if-no-files-found: ignore

  expression-language:
    name: CEL engines
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: spikes/expression-language
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: python run_python.py google
      - run: node run_js.mjs
      - run: python compare.py --check

  sqlcipher:
    name: SQLCipher
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: spikes/sqlcipher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python check.py
      - run: python ci_check.py out/report.json

  builder-prototype:
    name: Template builder prototype
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: spikes/builder-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run check:browser
      - name: Keep the build and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-prototype
          path: |
            spikes/builder-prototype/dist/index.html
            spikes/builder-prototype/dist/shots/
          if-no-files-found: ignore
