services:
  caddy:
    build:
      context: ..
      dockerfile: deploy/caddy.Dockerfile
    restart: unless-stopped
    ports:
      # Another port only for a second stack beside this one, such as the browser
      # tests' (frontend/e2e/run.sh); SKJALD_ADDRESS must then carry it too.
      - "${SKJALD_HTTPS_PORT:-443}:${SKJALD_HTTPS_PORT:-443}"
    environment:
      SKJALD_ADDRESS: ${SKJALD_ADDRESS:-https://localhost}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # The TLS settings (and an uploaded certificate) the app writes.
      - skjald_tls:/etc/caddy/skjald:ro
    depends_on:
      - app

  app:
    build:
      context: ../backend
      args:
        # What the build calls itself: set by the installer and the skjald command.
        SKJALD_VERSION: ${SKJALD_VERSION:-}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      SKJALD_ADDRESS: ${SKJALD_ADDRESS:-https://localhost}
      SKJALD_DATA_DIR: /data
      SKJALD_MASTER_KEY_PATH: /etc/skjald/master.key
    volumes:
      - skjald_data:/data
      - ${SKJALD_ETC:-/etc/skjald}:/etc/skjald:ro
      - skjald_tls:/tls

  # The background worker: backups, the audit log's daily timestamp, email. The
  # same image and limits as the app, without a port.
  worker:
    build:
      context: ../backend
      args:
        # What the build calls itself: set by the installer and the skjald command.
        SKJALD_VERSION: ${SKJALD_VERSION:-}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["python", "-m", "app.worker"]
    environment:
      SKJALD_ADDRESS: ${SKJALD_ADDRESS:-https://localhost}
      SKJALD_DATA_DIR: /data
      SKJALD_MASTER_KEY_PATH: /etc/skjald/master.key
    volumes:
      - skjald_data:/data
      - ${SKJALD_ETC:-/etc/skjald}:/etc/skjald:ro
      # Backups kept on this server: a volume by default, or a folder on the host
      # (owned by UID 10001) when SKJALD_BACKUP_DIR names one, such as a mounted disk.
      - ${SKJALD_BACKUP_DIR:-skjald_backups}:/backups
      # Where it hands the renderer files to convert.
      - render_exchange:/exchange
    depends_on:
      - app
      - renderer

  # The renderer: turns files from outside (customers' report backgrounds, as PDF)
  # into pages, and from Phase 3 renders reports. The app's image with no network at
  # all, nothing to write but the folder it shares with the worker, and its own
  # limits; it holds no keys and never sees the database.
  renderer:
    build:
      context: ../backend
      args:
        # What the build calls itself: set by the installer and the skjald command.
        SKJALD_VERSION: ${SKJALD_VERSION:-}
    restart: unless-stopped
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1
    pids_limit: 64
    command: ["python", "-m", "app.renderer"]
    volumes:
      - render_exchange:/exchange

  # For the skjald command, never started with the others: what has to write to
  # the master key's folder (rotating the key) or work on the data while the app
  # is stopped (copying it aside before an update). The same image and limits.
  tools:
    build:
      context: ../backend
      args:
        # What the build calls itself: set by the installer and the skjald command.
        SKJALD_VERSION: ${SKJALD_VERSION:-}
    profiles: ["tools"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      SKJALD_ADDRESS: ${SKJALD_ADDRESS:-https://localhost}
      SKJALD_DATA_DIR: /data
      SKJALD_MASTER_KEY_PATH: /etc/skjald/master.key
    volumes:
      - skjald_data:/data
      - ${SKJALD_ETC:-/etc/skjald}:/etc/skjald
      - ${SKJALD_BACKUP_DIR:-skjald_backups}:/backups

volumes:
  caddy_data:
  caddy_config:
  skjald_data:
  skjald_backups:
  skjald_tls:
  # In memory: customers' files pass through it on their way to the renderer.
  render_exchange:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=128m,uid=10001,gid=10001,mode=0700"
